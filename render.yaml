services:
  # Legacy Render web app retained for reference; Cloudflare serves the frontend.
  - type: web
    name: geoflow-lab-web
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CALC_ENGINE_URL
        sync: false
      - key: CALC_ENGINE_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_ANNUAL_PRICE_ID
        sync: false
      - key: BILLING_ENABLED
        value: "false"
  - type: worker
    name: whittaker-geo-saved-calculations
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerCommand: python -m worker.jobs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Separate HTTP service for transient live edits; saved runs keep their worker.
  - type: web
    name: whittaker-geo-live-calculations
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerCommand: python -m worker.live
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CALC_ENGINE_SECRET
        sync: false
      - key: LIVE_MAX_CONCURRENCY
        value: 1
      - key: LIVE_EVALUATION_TIMEOUT_SECONDS
        value: 24
